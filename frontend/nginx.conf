server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # must be a little above MAX_UPLOAD_MB so the backend can return a friendly error
    client_max_body_size 160m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;   # stream big uploads straight to the backend
        proxy_read_timeout 300s;       # PDF generation for large reports
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # single-page app: let React Router handle unknown paths
    location / {
        try_files $uri /index.html;
    }
}
